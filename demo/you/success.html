<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>送信完了｜ひばり台まなびラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2823;--ink-soft:#5c6660;--green:#0d5c4a;--sun:#f2b135}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:#fff;font-size:16px;line-height:2.1;letter-spacing:.03em;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{max-width:640px;padding:48px 24px;text-align:center}
h1{font-family:"Zen Kaku Gothic New",sans-serif;font-size:1.5rem;font-weight:900;letter-spacing:.08em;margin-bottom:22px}
h1::after{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--sun);margin:20px auto 0}
p{font-size:.9375rem;color:var(--ink-soft)}
.back{display:inline-block;margin-top:36px;background:var(--green);color:#fff;padding:15px 44px;font-weight:700;border-radius:999px;font-family:"Zen Kaku Gothic New",sans-serif}
a{text-decoration:none;color:inherit}
</style>
</head>
<body>
<div class="box">
  <h1>送信ありがとうございました</h1>
  <p>内容を確認のうえ、<strong>24時間以内</strong>にメールまたはお電話でご返信します。<br>お急ぎの場合は 042-000-0000（受付 14:00〜21:30）へお電話ください。</p>
  <a class="back" href="./">トップページへ戻る</a>
</div>
</body>
</html>
