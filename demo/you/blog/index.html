<style>
:root{--ink:#1f2823;--ink-soft:#5c6660;--green:#0d5c4a;--green-pale:#e3efe9;--sun:#f2b135;--sun-pale:#fdeecb;--line:#e2dccb;--head:"Zen Kaku Gothic New",sans-serif;--sans:"Noto Sans JP",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);color:var(--ink);background:#fff;font-size:16px;line-height:2.05;letter-spacing:.03em}
a{color:inherit;text-decoration:none}
.bhead{border-bottom:1px solid var(--line)}
.bhead__inner{max-width:840px;margin:0 auto;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.bhead__brand{font-family:var(--head);font-weight:900;font-size:1.125rem;letter-spacing:.08em;display:flex;align-items:center;gap:10px}
.bhead__brand::before{content:"ま";display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;background:var(--green);color:#fff;font-size:1rem}
.bhead__back{font-size:.8125rem;color:var(--green);font-weight:700;border-bottom:2px solid var(--sun);padding-bottom:2px}
.wrap{max-width:840px;margin:0 auto;padding:56px 24px 96px}
.art__eyecatch{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:20px;margin-bottom:30px}
.art__title{font-family:var(--head);font-size:clamp(1.5rem,3.4vw,2.125rem);font-weight:900;letter-spacing:.05em;line-height:1.7}
.art__date{margin-top:12px;color:var(--ink-soft);font-size:.875rem;border-bottom:1px solid var(--line);padding-bottom:24px}
.art__body{margin-top:32px}
.art__body h2{font-family:var(--head);font-weight:900;font-size:1.375rem;margin:2.2em 0 .8em;line-height:1.7;background:linear-gradient(transparent 62%,var(--sun-pale) 62%);display:inline-block}
.art__body h3{font-size:1.0925rem;font-weight:700;color:var(--green);margin:1.8em 0 .6em}
.art__body p{margin:1.1em 0;color:#39433d}
.art__body ul,.art__body ol{margin:1.1em 0;padding-left:1.6em;color:#39433d}
.art__body img{max-width:100%;height:auto;display:block;margin:1.6em auto;border-radius:16px}
.art__body blockquote{border-left:4px solid var(--green-pale);padding:4px 0 4px 20px;color:var(--ink-soft);margin:1.4em 0}
.art__body a{color:var(--green);text-decoration:underline}
.art__body hr{border:none;border-top:1px solid var(--line);margin:2.4em 0}
.art__list{list-style:none;margin-top:36px}
.art__list li a{display:flex;gap:18px;align-items:center;padding:14px 12px;border-radius:16px;transition:background .2s;border-bottom:1px solid var(--line)}
.art__list li a:hover{background:var(--green-pale)}
.art__list-thumb{width:124px;height:80px;object-fit:cover;flex-shrink:0;border-radius:12px}
.art__list-thumb--none{background:radial-gradient(circle at 30% 30%,rgba(13,92,74,.08),transparent 60%),#eef2ec}
.art__list-meta{display:flex;flex-direction:column;gap:4px}
.art__list-meta b{font-weight:700;line-height:1.6}
.art__list time{font-size:.8125rem;color:var(--ink-soft);white-space:nowrap;font-weight:500}
.art__cta{margin-top:72px;background:var(--green);border-radius:24px;color:#fff;text-align:center;padding:46px 28px}
.art__cta p{font-family:var(--head);font-weight:700;font-size:1.125rem;letter-spacing:.06em;line-height:1.9}
.art__cta a{display:inline-block;margin-top:20px;background:var(--sun);color:var(--ink);padding:15px 44px;font-weight:700;border-radius:999px;font-family:var(--head)}
.bfoot{border-top:1px solid var(--line);text-align:center;padding:28px;font-size:.75rem;color:var(--ink-soft)}
@media(max-width:767px){.wrap{padding:40px 20px 72px}.art__list li a{flex-direction:column;gap:4px}}
</style>
</head>
<body>
