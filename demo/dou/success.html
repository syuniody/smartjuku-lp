<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>送信完了｜みちしるべ学習コーチング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--navy:#175873;--navy-deep:color-mix(in srgb,#175873 78%,#000);--navy-pale:color-mix(in srgb,#175873 12%,#fff);--org:#b85c0a;--org-light:#ef8a2b;--org-deep:color-mix(in srgb,#b85c0a 82%,#000)}
:root{--ink:#1f2430;--ink-soft:#5b616e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:#fff;font-size:16px;line-height:2.1;letter-spacing:.03em;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{max-width:640px;padding:48px 24px;text-align:center}
h1{font-size:1.5rem;font-weight:900;letter-spacing:.06em;margin-bottom:22px}
h1::after{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--org);margin:20px auto 0}
p{font-size:.9375rem;color:var(--ink-soft)}
.back{display:inline-block;margin-top:36px;background:var(--navy);color:#fff;padding:15px 44px;font-weight:700;border-radius:var(--r)}
a{text-decoration:none;color:inherit}
</style>
</head>
<body>
<div class="box">
  <h1>送信ありがとうございました</h1>
  <p>内容を確認のうえ、ご連絡します。<br>お急ぎの場合は、お電話（026-000-0000）でもお問い合わせいただけます。</p>
  <a class="back" href="./">トップページへ戻る</a>
</div>
</body>
</html>
