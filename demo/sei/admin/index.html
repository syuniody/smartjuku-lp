  <!-- 公開デモ用：test-repoバックエンド。編集はブラウザ内のみで、リロードすると元に戻ります -->
  <script>window.repoFiles = {"data": {"faq.json": {"content": "{\n  \"items\": [\n    {\n      \"q\": \"個別指導と少人数指導は、どう使い分けるのですか？\",\n      \"a\": \"苦手教科は講師1人に生徒2人までの個別指導で、つまずきの根本から立て直します。得意教科や演習量を増やしたい教科は最大6名の少人数指導で鍛えます。組み合わせは学力診断の結果をもとに教室長がご提案し、途中で変更もできます。\"\n    },\n    {\n      \"q\": \"料金はいくらですか？\",\n      \"a\": \"月謝（税込）は小学生8,800円〜、中学生15,400円〜、高校生19,800円〜です。入塾金11,000円、教材費は実費（年間6,000〜10,000円程度）で、設備費・管理費はいただきません。夏期講習の目安は小学生16,500円〜、中1・2で24,200円〜、中3で41,800円〜です。\"\n    },\n    {\n      \"q\": \"成績が低くても入塾できますか？\",\n      \"a\": \"はい、入塾テストで選抜はしません。当塾の塾生の多くは「平均点に届かない」状態からのスタートです。最初の学力診断はあくまで計画づくりのためのもので、必要であれば前の学年まで戻って学習計画を作ります。\"\n    },\n    {\n      \"q\": \"体験授業はありますか？\",\n      \"a\": \"はい、無料で2回まで受けられます。担当予定の講師が実際の授業と同じ形式で行い、体験後にお子さまの学習状況のフィードバックをお渡しします。体験後に入塾しなくても構いません。無理な勧誘は一切いたしません。\"\n    },\n    {\n      \"q\": \"どこの学校の生徒が通っていますか？\",\n      \"a\": \"藤が丘中学校・桜台中学校の生徒が中心で、小学生は藤が丘小・桜台小、高校生は岐阜高校・加納高校・長良高校などの生徒が通っています。両中学校の定期テストの出題傾向と提出物のスケジュールを把握したうえで、テスト3週間前から対策に切り替えます。\"\n    },\n    {\n      \"q\": \"不登校で学校に行けていないのですが、通えますか？\",\n      \"a\": \"はい、通っていただけます。学力診断で抜けている単元を特定し、その子のペースで戻り学習から始めます。人の少ない夕方前の時間帯（15:30〜17:00）のご案内や、在籍校の出席扱い制度（学習記録の提出）のご相談も可能です。\"\n    },\n    {\n      \"q\": \"どんな先生が教えてくれますか？\",\n      \"a\": \"教室長と、教室長の研修を修了した講師が担当します。担当講師は固定制で、体験授業の様子を見て相性まで考えて決めます。合わないと感じた場合は理由を聞かずに交代しますので、遠慮なくお申し出ください。\"\n    },\n    {\n      \"q\": \"振替はできますか？\",\n      \"a\": \"個別指導は前日までのご連絡で、同月内に無料で振替できます。少人数指導は曜日固定のため振替はありませんが、欠席回の内容はプリントと動画で補習します。\"\n    },\n    {\n      \"q\": \"宿題はどのくらい出ますか？\",\n      \"a\": \"「一人でも確実にできる量」に絞って出し、次の授業で必ず確認します。学校の宿題や提出物が多い週は、面談なしでも調整しますので、お子さまから担当講師に伝えてもらえれば大丈夫です。\"\n    },\n    {\n      \"q\": \"保護者への報告はありますか？\",\n      \"a\": \"毎月、学習内容と現在の課題をまとめた報告をLINEでお送りします。また、学期ごと（年3回）の保護者面談で、成績の推移と次の学期の計画をご説明します。\"\n    },\n    {\n      \"q\": \"月謝の支払い方法を教えてください。\",\n      \"a\": \"口座振替（毎月27日引き落とし）です。初月のみ、現金またはお振込をお願いしています。\"\n    },\n    {\n      \"q\": \"退塾したいときは、どうすればいいですか？\",\n      \"a\": \"前月の15日までにお申し出いただければ、当月末で退塾できます。年間契約の縛りや違約金はありません。ご家庭の事情による休塾（月単位）も可能です。\"\n    }\n  ]\n}\n"}, "goukaku.json": {"content": "{\n  \"cards\": [\n    {\n      \"title\": \"2026年春（今年度）\",\n      \"rows\": [\n        { \"name\": \"岐阜高校・岐阜北高校\", \"num\": \"3名\" },\n        { \"name\": \"加納高校・岐山高校・長良高校\", \"num\": \"6名\" },\n        { \"name\": \"私立 鶯谷・岐阜東 ほか\", \"num\": \"7名\" },\n        { \"name\": \"大学：岐阜大学・名古屋市立大学 ほか\", \"num\": \"4名\" },\n        { \"name\": \"中学受験：岐阜東中・鶯谷中\", \"num\": \"2名\" }\n      ]\n    },\n    {\n      \"title\": \"開校からの実績（2012年〜）\",\n      \"rows\": [\n        { \"name\": \"公立高校への合格\", \"num\": \"延べ118名\" },\n        { \"name\": \"私立高校への合格\", \"num\": \"延べ96名\" },\n        { \"name\": \"国公立大学への合格\", \"num\": \"延べ23名\" },\n        { \"name\": \"第一志望校への合格率（直近3年・高校受験）\", \"num\": \"81%\" },\n        { \"name\": \"英検合格（2025年度・5級〜2級）\", \"num\": \"47名\" }\n      ]\n    }\n  ]\n}\n"}, "news.json": {"content": "{\n  \"items\": [\n    {\n      \"date\": \"2026-06-30\",\n      \"label\": \"講習\",\n      \"text\": \"夏期講習（7/21〜8/28）の受付を開始しました。中3生は7月11日まで早期割引（講習費10%引）があります。\"\n    },\n    {\n      \"date\": \"2026-06-14\",\n      \"label\": \"募集\",\n      \"text\": \"7月入塾の募集状況：中3は満席のため待機登録のみ、その他の学年は受付中です。\"\n    },\n    {\n      \"date\": \"2026-06-02\",\n      \"label\": \"実績\",\n      \"text\": \"1学期中間テストの結果を更新しました。塾生の5教科平均は前回比+41点でした。詳しくは合格実績・成績の実例をご覧ください。\"\n    }\n  ]\n}\n"}, "pricing.json": {"content": "{\n  \"tabs\": [\n    {\n      \"id\": \"elementary\",\n      \"label\": \"小学生\",\n      \"en\": \"Elementary\",\n      \"title\": \"小学生コース\",\n      \"lead\": \"学習習慣づくりから中学受験まで。低学年は「勉強が好きになる」ことを最優先に設計します。\",\n      \"courses\": [\n        {\n          \"name\": \"小学生 基礎コース\",\n          \"target\": \"小1〜小6｜算数・国語・英語\",\n          \"desc\": \"学校の進度に合わせた基礎固めと学習習慣づくり。「宿題をやる→塾で確認する」のリズムを作り、中学の学習につなげます。\",\n          \"price_label\": \"月謝（税込）\",\n          \"prices\": [\n            { \"label\": \"週1回\", \"amount\": \"8,800\" },\n            { \"label\": \"週2回\", \"amount\": \"16,500\" }\n          ]\n        },\n        {\n          \"name\": \"中学受験コース\",\n          \"target\": \"小4〜小6｜4教科対応\",\n          \"desc\": \"東海・滝・岐阜東などの中学受験に対応。個別指導で弱点単元を、少人数演習で得点力を鍛えます。志望校面談を学期ごとに実施します。\",\n          \"price_label\": \"月謝（税込）\",\n          \"prices\": [\n            { \"label\": \"週2回\", \"amount\": \"26,400\" },\n            { \"label\": \"週3回\", \"amount\": \"36,300\" }\n          ]\n        }\n      ]\n    },\n    {\n      \"id\": \"junior\",\n      \"label\": \"中学生\",\n      \"en\": \"Junior High\",\n      \"title\": \"中学生コース\",\n      \"lead\": \"藤が丘中・桜台中の定期テスト対策と高校受験。内申と当日点の両面から合格までの距離を数字で示します。\",\n      \"courses\": [\n        {\n          \"name\": \"中学生 標準コース\",\n          \"target\": \"中1〜中3｜5教科対応\",\n          \"desc\": \"数学・英語を個別または少人数で受講し、テスト3週間前からは理社国を含む5教科対策に切り替え。学校ワークの完了まで管理します。\",\n          \"price_label\": \"月謝（税込）\",\n          \"prices\": [\n            { \"label\": \"週1回\", \"amount\": \"15,400\" },\n            { \"label\": \"週2回\", \"amount\": \"28,600\" }\n          ]\n        },\n        {\n          \"name\": \"中3 受験コース\",\n          \"target\": \"中3の9月〜｜高校受験対策\",\n          \"desc\": \"志望校判定と過去問演習を軸にした受験専用カリキュラム。進路面談を毎月行い、岐阜県の入試傾向に合わせて仕上げます。\",\n          \"price_label\": \"月謝（税込）\",\n          \"prices\": [\n            { \"label\": \"週2回\", \"amount\": \"31,900\" },\n            { \"label\": \"週3回\", \"amount\": \"41,800\" }\n          ]\n        }\n      ]\n    },\n    {\n      \"id\": \"high\",\n      \"label\": \"高校生\",\n      \"en\": \"High School\",\n      \"title\": \"高校生コース\",\n      \"lead\": \"高校の定期テストから大学受験の二次対策まで。中学から続けて通う塾生が中心の、落ち着いた環境です。\",\n      \"courses\": [\n        {\n          \"name\": \"高校生 個別コース\",\n          \"target\": \"高1〜高3｜英数国中心\",\n          \"desc\": \"学校の課題・定期テスト対策から共通テスト・二次対策まで、1対2の個別指導で。教室長が受験戦略の面談を学期ごとに行います。\",\n          \"price_label\": \"月謝（税込）\",\n          \"prices\": [\n            { \"label\": \"週1回\", \"amount\": \"19,800\" },\n            { \"label\": \"週2回\", \"amount\": \"37,400\" }\n          ]\n        }\n      ]\n    },\n    {\n      \"id\": \"eiken\",\n      \"label\": \"英検対策\",\n      \"en\": \"Eiken\",\n      \"title\": \"英検対策コース\",\n      \"lead\": \"5級から2級まで、二次面接対策込み。当教室は英検の準会場です（塾生以外も受検できます）。\",\n      \"courses\": [\n        {\n          \"name\": \"英検対策コース\",\n          \"target\": \"小4〜高3｜5級〜2級\",\n          \"desc\": \"級ごとの少人数クラスで、語彙・リスニング・ライティング・二次面接まで対策。2025年度は47名が合格しました。\",\n          \"price_label\": \"月謝（税込）\",\n          \"prices\": [\n            { \"label\": \"週1回\", \"amount\": \"9,900\" },\n            { \"label\": \"検定直前パック\", \"amount\": \"16,500\" }\n          ]\n        }\n      ]\n    }\n  ],\n  \"memo\": [\n    \"入塾金 11,000円（税込）／教材費 実費（年間6,000〜10,000円程度）／設備費・管理費はいただきません。\",\n    \"きょうだい割引：2人目以降の月謝を20%引きします。複数コースの併用（例：中学生標準＋英検）は2つ目を半額にします。\"\n  ]\n}\n"}, "results.json": {"content": "{\n  \"items\": [\n    {\n      \"tag\": \"藤が丘中2年・数学｜入塾6ヶ月\",\n      \"before\": \"41点\",\n      \"after\": \"79\",\n      \"unit\": \"点\",\n      \"text\": \"小6の「速さ・割合」まで戻って個別で立て直し、少人数演習で定着。2学期期末で自己最高点を更新しました。\"\n    },\n    {\n      \"tag\": \"桜台中3年・5教科｜入塾1年\",\n      \"before\": \"263点\",\n      \"after\": \"402\",\n      \"unit\": \"点\",\n      \"text\": \"提出物の管理から立て直して内申が11上昇。第一志望の県立高校に合格しました。\"\n    },\n    {\n      \"tag\": \"高2・英語（模試偏差値）｜入塾8ヶ月\",\n      \"before\": \"48\",\n      \"after\": \"61\",\n      \"unit\": \"\",\n      \"text\": \"英検準2級→2級の対策と並行して長文読解を強化。学校推薦の基準もクリアしました。\"\n    }\n  ]\n}\n"}, "site-info.json": {"content": "{\n  \"brand\": {\n    \"name\": \"桜台ゼミナール\",\n    \"sub\": \"藤が丘校｜個別・少人数指導\",\n    \"mark\": \"誠\",\n    \"romaji\": \"Sakuradai Seminar Fujigaoka\"\n  },\n  \"contact\": {\n    \"tel\": \"058-000-0000\",\n    \"hoursShort\": \"15:00–22:00（日祝休）\",\n    \"hoursFull\": \"平日 15:00〜22:00／土曜 13:00〜21:00\",\n    \"closed\": \"日曜・祝日 休校\",\n    \"postal\": \"500-0000\",\n    \"pref\": \"岐阜県\",\n    \"city\": \"岐阜市\",\n    \"addr\": \"藤が丘3丁目12-8\",\n    \"building\": \"\",\n    \"lineUrl\": \"#\",\n    \"gmbUrl\": \"https://maps.google.com/\",\n    \"mapQuery\": \"岐阜県岐阜市藤が丘3丁目12-8\"\n  },\n  \"master\": { \"name\": \"桜井 誠一\", \"furigana\": \"さくらい せいいち\" },\n  \"colors\": { \"main\": \"#16467e\", \"accent\": \"#e97a1c\" },\n  \"area\": \"岐阜市藤が丘・桜台エリア\",\n  \"target\": \"小1〜高3・英検対応\",\n  \"hero\": {\n    \"title\": \"伸びない理由に、<br>先に手を打つ塾。\",\n    \"lead\": \"テストの点数には、必ず原因があります。桜台ゼミナールは、個別指導と少人数指導を組み合わせて、つまずきの根本から目標校まで逆算して鍛える、地域の進学塾です。\"\n  },\n  \"facts\": [\n    { \"dt\": \"対象\", \"dd\": \"小学1年生〜高校3年生\" },\n    { \"dt\": \"指導形態\", \"dd\": \"個別指導＋少人数指導（最大6名）\" },\n    { \"dt\": \"対応\", \"dd\": \"中学受験・高校受験・大学受験・英検\" },\n    { \"dt\": \"月謝\", \"dd\": \"小学生 8,800円〜／中学生 15,400円〜（税込）\" }\n  ],\n  \"stats\": [\n    { \"label\": \"開校からの指導実績\", \"num\": \"14\", \"unit\": \"年\", \"note\": \"2012年開校\" },\n    { \"label\": \"定期テスト5教科の上がり幅\", \"num\": \"+58\", \"unit\": \"点\", \"note\": \"入塾後2回目・塾生平均（2025年度）\" },\n    { \"label\": \"第一志望校への合格率\", \"num\": \"81\", \"unit\": \"%\", \"note\": \"直近3年・高校受験\" },\n    { \"label\": \"英検 合格者数\", \"num\": \"47\", \"unit\": \"名\", \"note\": \"2025年度・5級〜2級\" }\n  ],\n  \"reason\": [\n    { \"title\": \"個別×少人数の使い分け\", \"txt\": \"苦手教科は<strong>1対2の個別</strong>でつまずきの根本から。得意教科は<strong>最大6名の少人数</strong>で演習量と競争心を。教科ごとに最適な形式を組み合わせます。\" },\n    { \"title\": \"教室長が全員の計画を設計\", \"txt\": \"入塾時の学力診断から、<strong>どこまで戻って・いつまでに・何をやるか</strong>を教室長が設計。毎回の授業後に講師と共有し、計画とのズレをその週のうちに直します。\" },\n    { \"title\": \"小1から高3まで、一貫して見る\", \"txt\": \"高校進学後も同じ教室で続けられるので、<strong>指導が受験ごとに途切れません</strong>。定期テストから大学入試の二次対策、英検まで対応します。\" }\n  ],\n  \"voice\": [\n    { \"txt\": \"個別と少人数を組み合わせられるのが決め手でした。苦手な数学だけ個別にしてもらい、半年で平均点を超えました。\", \"who\": \"中2女子の保護者｜通塾1年（Googleの口コミより）\" },\n    { \"txt\": \"教室長が子どもの性格までよく見てくれています。面談のたびに「次はここを直す」が明確で、親として安心できます。\", \"who\": \"小6男子の保護者｜通塾2年\" },\n    { \"txt\": \"高校進学後も同じ教室で続けられるのが良いです。定期テストの対策から英検まで、全部ここで済んでいます。\", \"who\": \"高1女子の保護者｜通塾4年\" }\n  ],\n  \"masterMsg\": [\n    \"「なぜ伸びないのか」を言葉にできないまま、頑張れという塾が多すぎると感じてきました。点数が上がらないのには必ず原因があります。<strong>原因を特定して、先に手を打つ。</strong>それがこの教室の仕事です。\",\n    \"面談では、できていないことも正直にお伝えします。耳の痛い話もあるかもしれませんが、ごまかして成績が上がることはないからです。まずは学力診断から、お子さまの現在地を一緒に見ましょう。\"\n  ],\n  \"masterCareer\": [\n    \"大手予備校で大学受験科を7年間担当。担当生徒は延べ1,200名以上\",\n    \"2012年、地元の藤が丘に桜台ゼミナールを開校。以来14年間、全塾生の学習計画を自ら設計\",\n    \"英検1級・数学検定1級。岐阜県内の高校入試分析レポートを毎年発行\"\n  ],\n  \"teachers\": [\n    { \"role\": \"講師（数学・理科）\", \"name\": \"高山 美咲\", \"furigana\": \"たかやま みさき\", \"msg\": \"数学が苦手な子の「どこから分からなくなったか」を見つけるのが得意です。授業では答えを教えるより先に、<strong>手が止まった理由</strong>を聞きます。指導歴8年。中学生の定期テスト対策と高校数学を担当しています。\" },\n    { \"role\": \"講師（英語・国語）\", \"name\": \"森本 大輔\", \"furigana\": \"もりもと だいすけ\", \"msg\": \"英検対策と読解指導を担当。<strong>「訳せるのに解けない」を直す</strong>のが仕事です。当塾の英検合格者の対策授業はすべて私が設計しています。指導歴6年。\" }\n  ],\n  \"costCards\": [\n    { \"title\": \"入塾時・毎月\", \"rows\": [\n      { \"name\": \"入塾金（入塾時のみ）\", \"num\": \"11,000円\" },\n      { \"name\": \"月謝（コースによる）\", \"num\": \"8,800円〜\" },\n      { \"name\": \"教材費（実費・年間）\", \"num\": \"6,000〜10,000円\" },\n      { \"name\": \"設備費・管理費など\", \"num\": \"0円\" }\n    ]},\n    { \"title\": \"季節講習の目安（税込）\", \"rows\": [\n      { \"name\": \"夏期講習 小学生\", \"num\": \"16,500円〜\" },\n      { \"name\": \"夏期講習 中1・中2\", \"num\": \"24,200円〜\" },\n      { \"name\": \"夏期講習 中3\", \"num\": \"41,800円〜\" },\n      { \"name\": \"冬期講習（各学年）\", \"num\": \"夏期の6〜7割程度\" }\n    ]}\n  ],\n  \"costMemo\": \"※講習は強制ではありません。コマ数は面談でご相談のうえ決めます。きょうだい割引：2人目以降の月謝を20%引きします。\",\n  \"timetable\": {\n    \"cols\": [\"①\", \"②\", \"③\", \"④\"],\n    \"rows\": [\n      { \"label\": \"平日\", \"cells\": [\"15:30〜16:50／小学生中心\", \"17:00〜18:20\", \"18:30〜19:50\", \"20:00〜21:20／中3・高校生\"] },\n      { \"label\": \"土曜\", \"cells\": [\"13:00〜14:20\", \"14:30〜15:50\", \"16:00〜17:20\", \"17:30〜18:50\"] }\n    ],\n    \"note\": \"1コマ80分。日曜・祝日は休校です（テスト前は対策開放日を設けます）。\"\n  },\n  \"support\": {\n    \"show\": true,\n    \"title\": \"学校に行けていない<br>お子さまの学習も支えます\",\n    \"body\": \"桜台ゼミナールは、<strong>不登校・行きしぶりのお子さまの学習サポート</strong>を行っています。学校の授業に出られていない期間があっても、学力診断で抜けている単元を特定し、その子のペースで戻り学習から始めます。\",\n    \"list\": [\n      \"人の少ない夕方前の時間帯（15:30〜17:00）をご案内できます\",\n      \"在籍校の出席扱い制度（学習記録の提出）のご相談も可能です\",\n      \"まずは保護者の方だけのご相談でも構いません\"\n    ]\n  },\n  \"access\": {\n    \"route\": \"藤が丘小学校から徒歩5分。県道沿い、1階がオレンジの看板の建物です。駐輪場あり。\",\n    \"parking\": \"建物裏に送迎用の停車スペースが2台分あります。お迎えは授業終了5分前を目安にお越しください。\"\n  }\n}\n"}, "taiken.json": {"content": "{\n  \"items\": [\n    {\n      \"school\": \"岐阜高校\",\n      \"who\": \"桜台中出身・Kさん（通塾3年）\",\n      \"year\": \"2026年春\",\n      \"text\": \"中1の頃は数学が平均点ぎりぎりでした。個別で戻り学習をしてから少人数クラスに移ったら、まわりの速さに食らいつくのが逆に楽しくなって、気づいたら数学が得点源になっていました。桜井先生の「原因がわかれば直せる」は本当でした。\"\n    },\n    {\n      \"school\": \"加納高校\",\n      \"who\": \"藤が丘中出身・Tくん（通塾2年）\",\n      \"year\": \"2026年春\",\n      \"text\": \"部活を引退した夏からのスタートで間に合うか不安でしたが、毎月の面談で「あと何点、どの教科で取るか」が具体的だったので、迷わず勉強できました。ワークの管理をしてもらえたおかげで内申も上がりました。\"\n    },\n    {\n      \"school\": \"岐阜大学 教育学部\",\n      \"who\": \"高校コース・Mさん（通塾6年）\",\n      \"year\": \"2026年春\",\n      \"text\": \"中1から高3まで通いました。高校に入ってからも同じ先生に見てもらえたのが一番大きかったです。共通テストの計画も、二次の記述の添削も、全部この教室で完結しました。\"\n    }\n  ]\n}\n"}}, "blog-posts": {"2026-06-25-teiki-test-kaizen.md": {"content": "---\ntitle: 定期テストの「見直し」、答え合わせで終わっていませんか\ndate: 2026-06-25\ndescription: テスト返却後の見直しを「答え合わせ」で終わらせず、次のテストの点数につなげる3ステップを紹介します。\n---\n\n1学期の期末テストが返ってきました。この時期、面談でよくお見せするのが「見直しの3ステップ」です。多くのお子さんの見直しは、実は**答え合わせ**で終わっています。\n\n## ステップ1：間違いを3種類に分ける\n\n- **ケアレスミス**（わかっていたのに落とした）\n- **時間切れ**（解けたはずなのに届かなかった）\n- **未理解**（そもそも解き方がわからなかった)\n\nこの仕分けだけで、対策はまったく変わります。ケアレスミスの多い子に「もっと勉強しなさい」は逆効果です。\n\n## ステップ2：「未理解」だけをやり直す\n\n3種類のうち、解き直しに時間をかける価値があるのは「未理解」だけです。しかも、その単元のもっと手前に原因があることが多い。ここは塾の学力診断の出番だと思っています。\n\n## ステップ3：次のテストの「作戦」に変える\n\n「次は何点」ではなく「どの教科の、どの大問で、何点拾うか」まで決めます。当塾の塾生が面談のたびに数字に強くなっていくのは、この作戦会議を繰り返しているからです。\n\nテストの結果で気になることがあれば、[無料の学力診断](../contact/)でご相談ください。答案を持ってきていただければ、その場で3ステップの仕分けをやってみせます。\n"}}};</script>
