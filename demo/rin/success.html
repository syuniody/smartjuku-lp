<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>送信完了｜春岡個別学習塾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#23262b;--ink-soft:#5a5f66;--navy:#1c3d5a;--ver:#b3402a;--line:#d9d2c3}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:#fff;font-size:16px;line-height:2.1;letter-spacing:.04em;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{max-width:640px;padding:48px 24px;text-align:center}
h1{font-family:"Shippori Mincho B1",serif;font-size:1.625rem;font-weight:600;letter-spacing:.14em;margin-bottom:24px}
h1::after{content:"";display:block;width:44px;height:1px;background:var(--ver);margin:22px auto 0}
p{font-size:.9375rem;color:var(--ink-soft)}
.back{display:inline-block;margin-top:36px;background:var(--navy);color:#fff;padding:15px 44px;font-weight:700;letter-spacing:.08em}
a{text-decoration:none;color:inherit}
</style>
</head>
<body>
<div class="box">
  <h1>送信ありがとうございました</h1>
  <p>内容を確認のうえ、<strong>24時間以内</strong>にメールまたはお電話でご返信します。<br>お急ぎの場合は 052-000-0000（受付 15:00〜22:00）へお電話ください。</p>
  <a class="back" href="./">トップページへ戻る</a>
</div>
</body>
</html>
