name: Meta Adhoc Report
on:
  workflow_dispatch:
    inputs:
      since:
        description: '開始日 YYYY-MM-DD'
        default: '2026-08-01'
      until:
        description: '終了日 YYYY-MM-DD'
        default: '2026-08-13'
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run report
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          REPORT_SINCE: ${{ inputs.since }}
          REPORT_UNTIL: ${{ inputs.until }}
        run: python scripts/meta_adhoc_report.py
